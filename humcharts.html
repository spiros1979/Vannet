<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BME680 - Γραφήματα Υγρασίας</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: rgb(238, 238, 237);
            color: #241e1d;
        }

        /* Banner */
        .banner {
            background-color: rgb(188, 173, 175);
            padding: 20px 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
            width: 100%;
            color: #241e1d;
        }

        .banner-title {
            font-size: 24px;
            font-weight: bold;
        }

        /* Εικονίδια πλοήγησης */
        .nav-item img {
            width: 24px;
            height: 24px;
            display: inline-block;
            filter: invert(18%) sepia(6%) saturate(9%) hue-rotate(356deg) brightness(94%) contrast(94%);
        }

        /* Περιέκτης γραφημάτων */
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        /* Πλοήγηση */
        nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap; /* επιτρέπει wrapping μόνο όταν χρειάζεται */
        }

        .nav-item {
            margin-left: 20px;
            display: inline-block;
            vertical-align: middle;
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 576px) {
            nav {
                justify-content: center; /* κεντράρει τα εικονίδια στο mobile */
            }
            .nav-item {
                margin-left: 10px; /* μικρότερο κενό */
                margin-bottom: 10px; /* κάθετο κενό ανάμεσα στις σειρές */
            }
        }

        /* Footer */
        footer {
            margin-top: 50px;
            padding: 10px 0;
            text-align: center;
            font-size: 12px;
            color: #241e1d;
        }

        footer img {
            margin: 0 10px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            filter: invert(18%) sepia(6%) saturate(9%) hue-rotate(356deg) brightness(94%) contrast(94%);
        }
    </style>
</head>

<body>
    <!-- Banner -->
    <div class="banner">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <div class="banner-title">BME680 - Γραφήματα Υγρασίας</div>
                    <div class="banner-date" id="last-update">Τελευταία ενημέρωση: --/--/---- --:--:--</div>
                </div>
                <div class="col-6 text-right">
                    <nav>
                        <a class="nav-item" href="#" id="update-data">
                            <img src="arrows-counter-clockwise.svg" alt="Ανανέωση" title="Ανανέωση δεδομένων">
                        </a>
                        <a class="nav-item" href="index.html">
                            <img src="speedometer.svg" alt="Αρχική" title="Κεντρικός πίνακας">
                        </a>
                        <a class="nav-item" href="charts.html">
                            <img src="thermometer.svg" alt="Γραφήματα θερμοκρασίας" title="Γραφήματα θερμοκρασίας">
                        </a>
                        <a class="nav-item" href="presscharts.html">
                            <img src="cloud-sun.svg" alt="Γραφήματα πίεσης" title="Γραφήματα ατμοσφαιρικής πίεσης">
                        </a>
                        <a class="nav-item" href="aircharts.html">
                            <img src="fan.svg" alt="Γραφήματα ποιότητας αέρα" title="Γραφήματα ποιότητας αέρα">
                        </a>
                        <a class="nav-item" href="about.html">
                            <img src="info.svg" alt="Πληροφορίες" title="Σχετικά με τη σελίδα">
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Περιεχόμενο -->
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h4 id="latest-temp">Τελευταία υγρασία: -- %</h4>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-12 text-center">
                <select id="timeFilter" class="form-control w-35 mx-auto">
                    <option value="all">Όλα τα δεδομένα</option>
                    <option value="last24h">Τελευταίες 24 ώρες</option>
                    <option value="last12h">Τελευταίες 12 ώρες</option>
                    <option value="last6h">Τελευταίες 6 ώρες</option>
                    <option value="last3h">Τελευταίες 3 ώρες</option>
                    <option value="last1h">Τελευταία 1 ώρα</option>
                </select>
            </div>
        </div>
        <div class="row">
            <!-- Γράφημα λεπτό-λεπτό -->
            <div class="col-12">
                <div class="chart-container">
                    <canvas id="minutoChart"></canvas>
                </div>
            </div>
            <!-- Γράφημα μέσης ωριαίας υγρασίας -->
            <div class="col-12 mt-4">
                <div class="chart-container">
                    <canvas id="oraChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Σχετικά με εμένα</p>
        <a href="https://github.com/GarauGarau"><img src="github-logo.svg" alt="GitHub Logo"></a>
        <a href="https://x.com/alessiogarau22"><img src="x-logo.svg" alt="X (Twitter) Logo"></a>
        <a href="https://alessiogarau.io"><img src="user.svg" alt="Προσωπική ιστοσελίδα"></a>
    </footer>

    <!-- Δεν χρειάζεται πλέον PapaParse, τα δεδομένα έρχονται ως JSON -->
    <script src="appummidit.js"></script>
</body>
</html>
