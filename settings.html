<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Ρυθμίσεις</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ό,τι CSS έχεις και στις άλλες σελίδες -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <div class="container">
    <div class="row align-items-center">

      <div class="col-6">
        <h2 style="margin:0">Ρυθμίσεις</h2>
      </div>

      <div class="col-6 text-right">
        <nav>

          <a class="nav-item" href="#" id="update-data">
            <img src="arrows-counter-clockwise.svg"
                 alt="Ανανέωση"
                 title="Ανανέωση δεδομένων">
          </a>

          <a class="nav-item" href="index.html">
            <img src="speedometer.svg"
                 alt="Αρχική"
                 title="Κεντρικός πίνακας">
          </a>

          <a class="nav-item" href="charts.html">
            <img src="thermometer.svg"
                 alt="Γραφήματα θερμοκρασίας"
                 title="Γραφήματα θερμοκρασίας">
          </a>

          <a class="nav-item" href="presscharts.html">
            <img src="cloud-sun.svg"
                 alt="Γραφήματα πίεσης"
                 title="Γραφήματα πίεσης">
          </a>

          <a class="nav-item" href="aircharts.html">
            <img src="fan.svg"
                 alt="Γραφήματα ποιότητας αέρα"
                 title="Γραφήματα ποιότητας αέρα">
          </a>

          <a class="nav-item" href="about.html">
            <img src="info.svg"
                 alt="Πληροφορίες"
                 title="Σχετικά">
          </a>

          <!-- ΔΕΝ βάζουμε το gear εδώ -->

        </nav>
      </div>

    </div>
  </div>

  <!-- CONTENT -->
  <div class="container" style="margin-top:20px">

    <p>
      Εδώ θα μπουν σταδιακά οι ρυθμίσεις εμφάνισης, χρωμάτων και ορίων
      για τις ενδείξεις του συστήματος.
    </p>

    <!-- placeholder για επόμενα βήματα -->
    <div class="card">
      <p>⚙️ Ρυθμίσεις (σε εξέλιξη)</p>
    </div>

  </div>

  <!-- FOOTER -->
  <!-- Footer placeholder (έξω από το content) -->
  <div id="site-footer"></div>

  <script>
    fetch('/footer.html')
      .then(r => r.text())
      .then(html => {
        const el = document.getElementById('site-footer');
        if (el) el.innerHTML = html;
      })
      .catch(err => console.error('Σφάλμα φόρτωσης footer:', err));
  </script>

</body>
</html>
