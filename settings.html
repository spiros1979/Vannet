<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ρυθμίσεις - Vannet</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    body {
      background-color: rgb(238, 238, 237);
      color: #241e1d;
    }

    /* Banner */
    .banner {
      background-color: rgb(188, 173, 175);
      padding: 20px 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #dee2e6;
      width: 100%;
      color: #241e1d;
    }

    .banner-title {
      font-size: 24px;
      font-weight: bold;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-item {
      margin-left: 20px;
      display: inline-block;
      vertical-align: middle;
      text-align: center;
    }

    .nav-item img {
      width: 24px;
      height: 24px;
      display: inline-block;
      filter: invert(18%) sepia(6%) saturate(9%) hue-rotate(356deg) brightness(94%) contrast(94%);
    }

    @media (max-width: 576px) {
      nav { justify-content: center; }
      .nav-item { margin-left: 10px; margin-bottom: 10px; }
    }

    /* Content */
    .content {
      margin: 20px;
      font-size: 18px;
      line-height: 1.6;
    }

    h2, h3, h4 {
      color: rgb(110, 65, 69);
      font-weight: bold;
    }

    h3 { margin-top: 20px; }
    h4 { margin-top: 15px; }

    .content a {
      color: rgb(110, 65, 69);
      font-weight: bold;
      text-decoration: none;
    }
    .content a:hover { text-decoration: underline; }

    ul {
      list-style-type: disc;
      margin-left: 20px;
    }
  </style>
</head>

<body>
  <!-- Banner -->
  <div class="banner">
    <div class="container-fluid">
      <div class="row">
        <div class="col-6">
          <div class="banner-title">Ρυθμίσεις</div>
        </div>

        <div class="col-6 text-right">
          <nav>
            <a class="nav-item" href="#" id="update-data">
              <img src="arrows-counter-clockwise.svg" alt="Ανανέωση" title="Ανανέωση δεδομένων">
            </a>

            <a class="nav-item" href="index.html">
              <img src="speedometer.svg" alt="Home" title="Κεντρικός Πίνακας">
            </a>

            <a class="nav-item" href="charts.html">
              <img src="thermometer.svg" alt="Temperature Charts" title="Γραφήματα Θερμοκρασίας">
            </a>

            <a class="nav-item" href="humcharts.html">
              <img src="drop-half-bottom.svg" alt="Humidity Charts" title="Γραφήματα Υγρασίας">
            </a>

            <a class="nav-item" href="presscharts.html">
              <img src="cloud-sun.svg" alt="Pressure Charts" title="Γραφήματα Πίεσης">
            </a>

            <a class="nav-item" href="aircharts.html">
              <img src="fan.svg" alt="AIQ Charts" title="Γραφήματα Ποιότητας Αέρα">
            </a>

            <a class="nav-item" href="tank1.html">
              <img src="tank_1.svg" alt="Δεξαμενή 1" title="Δεξαμενή 1">
            </a>

            <a class="nav-item" href="tank2.html">
              <img src="tank_2.svg" alt="Δεξαμενή 2" title="Δεξαμενή 2">
            </a>

            <!-- εδώ ΔΕΝ βάζουμε gear -->
          </nav>
        </div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="container-fluid">
    <div class="content">

      <p>
        Εδώ θα μπουν σταδιακά οι ρυθμίσεις εμφάνισης, χρωμάτων και ορίων για τις ενδείξεις του συστήματος.
      </p>

      <h2>Ρυθμίσεις (σε εξέλιξη)</h2>
      <ul>
        <li>Εμφάνιση/απόκρυψη καρτών στο index</li>
        <li>Χρωματικός κώδικας για AIQ / θερμοκρασία κ.λπ.</li>
        <li>Όρια “καλό / μέτριο / κακό”</li>
      </ul>

    </div>
  </div>

  <!-- Footer placeholder (έξω από το content) -->
  <div id="site-footer"></div>

  <script>
    fetch('footer.html')
      .then(r => r.text())
      .then(html => {
        const el = document.getElementById('site-footer');
        if (el) el.innerHTML = html;
      })
      .catch(err => console.error('Σφάλμα φόρτωσης footer:', err));
  </script>
</body>
</html>
