<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BME680 - Γραφήματα Θερμοκρασίας</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Σταθερή έκδοση Chart.js 4 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        body {
            background-color: rgb(238, 238, 237);
            color: #241e1d;
        }

        /* Banner */
        .banner {
            background-color: rgb(188, 173, 175);
            padding: 20px 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
            width: 100%;
            color: #241e1d;
        }

        .banner-title {
            font-size: 24px;
            font-weight: bold;
        }

        /* Εικονίδια πλοήγησης */
        .nav-item img {
            width: 24px;
            height: 24px;
            display: inline-block;
            filter: invert(18%) sepia(6%) saturate(9%) hue-rotate(356deg) brightness(94%) contrast(94%);
        }

        /* Πλοήγηση */
        nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-item {
            margin-left: 20px;
            display: inline-block;
            vertical-align: middle;
            text-align: center;
        }

        @media (max-width: 576px) {
            nav { justify-content: center; }
            .nav-item { margin-left: 10px; margin-bottom: 10px; }
        }

        /* Contenitore grafico */
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        /* Τίτλοι κάτω από τα γραφήματα */
        .chart-title {
            text-align: center;
            font-weight: 600;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 17px;
            color: #241e1d;
        }
    </style>
</head>

<body>
    <!-- Banner -->
    <div class="banner">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <div class="banner-title">BME680 - Γραφήματα Θερμοκρασίας</div>
                    <div class="banner-date" id="last-update">Τελευταία ενημέρωση: --/--/---- --:--:--</div>
                </div>

                <div class="col-6 text-right">
                    <nav>
                        <a class="nav-item" href="#" id="update-data">
                            <img src="arrows-counter-clockwise.svg" alt="Ανανέωση" title="Ανανέωση δεδομένων">
                        </a>

                        <a class="nav-item" href="index.html">
                            <img src="speedometer.svg" alt="Αρχική" title="Κεντρικός Πίνακας">
                        </a>

                        <a class="nav-item" href="humcharts.html">
                            <img src="drop-half-bottom.svg" alt="Γραφήματα Υγρασίας" title="Γραφήματα υγρασίας">
                        </a>

                        <a class="nav-item" href="presscharts.html">
                            <img src="cloud-sun.svg" alt="Γραφήματα Πίεσης" title="Γραφήματα ατμοσφαιρικής πίεσης">
                        </a>

                        <a class="nav-item" href="aircharts.html">
                            <img src="fan.svg" alt="Γραφήματα Ποιότητας Αέρα" title="Γραφήματα ποιότητας αέρα">
                        </a>

                        <!-- (αν θες να βάλεις και tanks εδώ, πρόσθεσέ τα) -->
                        <!--
                        <a class="nav-item" href="tank1.html"><img src="tank_1.svg" alt="Δεξαμενή 1" title="Δεξαμενή 1"></a>
                        <a class="nav-item" href="tank2.html"><img src="tank_2.svg" alt="Δεξαμενή 2" title="Δεξαμενή 2"></a>
                        -->

                        <a class="nav-item" href="about.html">
                            <img src="info.svg" alt="Πληροφορίες" title="Σχετικά με τη σελίδα">
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Περιεχόμενο -->
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h4 id="latest-temp">Τελευταία θερμοκρασία: -- °C</h4>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12 text-center">
                <select id="timeFilter" class="form-control w-35 mx-auto">
                    <option value="all">Όλα τα δεδομένα</option>
                    <option value="last24h">Τελευταίες 24 ώρες</option>
                    <option value="last12h">Τελευταίες 12 ώρες</option>
                    <option value="last6h">Τελευταίες 6 ώρες</option>
                    <option value="last3h">Τελευταίες 3 ώρες</option>
                    <option value="last1h">Τελευταία 1 ώρα</option>
                </select>
            </div>
        </div>

        <div class="row">
            <!-- Γράφημα λεπτό-λεπτό -->
            <div class="col-12">
                <div class="chart-container">
                    <canvas id="minutoChart"></canvas>
                </div>
                <div class="chart-title">Θερμοκρασία — Ανάλυση λεπτού</div>
            </div>

            <!-- Γράφημα μέσης ωριαίας θερμοκρασίας -->
            <div class="col-12 mt-4">
                <div class="chart-container">
                    <canvas id="oraChart"></canvas>
                </div>
                <div class="chart-title">Θερμοκρασία — Ωριαία μέση τιμή &amp; 95% Διάστημα Εμπιστοσύνης</div>
            </div>
        </div>
    </div>

    <!-- Footer placeholder -->
    <div id="site-footer"></div>

    <!-- 1) Φόρτωσε το κοινό footer -->
    <script>
        fetch('footer.html')
            .then(r => r.text())
            .then(html => {
                const el = document.getElementById('site-footer');
                if (el) el.innerHTML = html;
            })
            .catch(err => console.error('Σφάλμα φόρτωσης footer:', err));
    </script>

    <!-- 2) Μετά φόρτωσε το JS της σελίδας -->
    <script src="app.js"></script>
</body>
</html>
